# Agenten-Vorlage (generisch — die Einträge unten sind nur Beispiele).
# Beim ersten Start nach /workspace/config/agents.yaml kopiert (dort editierbar).
# Credentials NICHT im Klartext — key_file referenziert eine Datei in /run/secrets.
#
# MCP-Tunnel (MCP_TUNNEL_ENABLED=true): Für jeden SSH-Agenten, dessen key_file
# existiert, öffnet der Container einen Reverse-Forward — auf dem Agenten-PC
# lauscht dann 127.0.0.1:<mcp_port> (Default 9000) auf den Dashboard-MCP-Server.
# Optional pro Agent `mcp_port: 9100` in der connection, falls 9000 dort belegt
# ist. Registrierung auf dem Agenten-PC: scripts/setup_agent_pc.sh [port].
#
# Kanal-Identität + Tool-Scoping (Issue #13): Jeder SSH-Agent bekommt im
# Container einen EIGENEN, an seinen Namen gebundenen MCP-Port (automatisch ab
# 9100; explizit via `mcp_local_port` in der connection). Der Tunnel forwardet
# dorthin — agent/sender sind dann durch den Kanal festgelegt, abweichende
# Werte lehnt der Server ab. `tools:` am Agenten begrenzt zusätzlich, welche
# Tools der Kanal überhaupt sieht. OHNE Angabe sieht er ALLE — auch
# call_integration (Server injiziert dort die Secrets) und fremde Mailboxen.
# Deshalb gehört an jeden Agenten eine Allowlist; für einen Watcher-Agenten
# reicht diese hier:
#
#  - name: beispiel-desktop
#    tools: [inbox, mark_read, send_message, ask, answer, claim_task, complete_task]
#    connection:
#      ...
#
# Nach Änderungen an tools/mcp_local_port den mcp-Dienst neu starten
# (supervisorctl restart mcp) — der Tunnel zieht binnen 60 s nach. Bis der
# gebundene Kanal steht, bleibt der Tunnel für diesen Agenten ausgesetzt
# (sichtbar im Log); einen Rückfall auf den freien Kanal :9000 gibt es
# bewusst nicht — dort wären agent/sender frei wählbar.
#
# Automatikmodus (Issue #12, Toggle im Agenten-Panel): das Dashboard hält per
# SSH einen agent_watcher.py auf dem Agenten-PC, der die Inbox über den
# gebundenen MCP-Kanal selbständig abarbeitet. Optional je Agent:
#   workdir: C:/projekte/foo   # Basis-Arbeitsverzeichnis für claude --print;
#                              # das `project` eines Tasks wählt ein Unter-
#                              # verzeichnis darunter (Issue #19)
#   python: python             # Python-Kommando auf dem PC (Default python3)
#   claude_bin: ~/claude/claude       # falls die automatische Suche nicht greift
#   permission_mode: acceptEdits      # an claude --permission-mode durchgereicht;
#                                     # headless beantwortet niemand Freigabe-Fragen
#   allowed_tools: [Edit, Write, "Bash(git:*)"]   # claude --allowed-tools (Issue #19)

agents:
#  - name: beispiel
#    description: "Beispiel-Eintrag"
#    role: worker
#    mode: mailbox
#    connection:
#      type: ssh
#      host: 192.168.1.99
#      port: 22
#      user: dev
#      auth: key
#      key_file: /run/secrets/beispiel_ed25519
#      mcp_port: 9100   # optional, falls 9000 auf dem Zielrechner belegt ist

# --- Optionen je Agent aus den Issues #52–#65 (alle optional) ----------------
#   model: sonnet                 # Modell der Automatik-Läufe (#62)
#   fallback_model: haiku         # Ausweichmodell bei Überlast
#   model_nachlauf: sonnet        # für Fortsetzungen nach Rückfrage und Weckrufe
#   modelle_erlaubt: [sonnet, haiku]   # was ein Auftraggeber per send_task(model=…) bestellen darf
#   resume_kalt_minuten: 60       # ab dieser Pause gilt der Prompt-Cache als kalt (#55)
#   resume_kompakt_ab: 200000     # kalt UND größer → neue Sitzung mit Übergabe; 0 = aus
#   max_kosten_tag: 50            # $ je Tag: darüber Rückfrage „weiter/stopp", Automatik wartet
#   max_kosten_lauf: 10           # $ je Lauf: darüber eine Warnung im Ereignis-Log
#   project_fallback: basis       # fehlendes project-Verzeichnis: im workdir laufen statt Rückfrage (#54)
#   ablage_erlaubt: [/srv/daten]  # absolute Zielordner für deliver_upload (#53)
#   freigabe_tool: mcp__dashboard__freigabe   # nur nötig, wenn der MCP-Server dort anders heißt (#56)
