; Prozessaufsicht für den Single-Container.
; Statt Prozesse im entrypoint mit '&' in den Hintergrund zu werfen
; (Crash bleibt unbemerkt), beaufsichtigt supervisord jeden Dienst,
; startet ihn bei Absturz neu und leitet Logs sauber nach stdout.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

; --- Reverse Proxy / SSL-Terminierung -------------------------------------
; nginx-Master als root (bindet 80/443), Worker droppen selbst auf www-data.
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- FastAPI Backend (REST + WebSocket) -----------------------------------
[program:api]
command=/opt/venv/bin/uvicorn main:app --host 127.0.0.1 --port %(ENV_API_PORT)s --log-level info
directory=/app/backend
user=app
; user= wechselt nur die UID, nicht HOME — ohne das sucht asyncssh
; (SSH-Terminal-Bridge) Default-Keys/Zertifikate in /root/.ssh und stirbt
; an PermissionError.
environment=HOME="/home/app",USER="app"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- MCP-Server (Tools für den Orchestrator) ------------------------------
; Streamable-HTTP, nur intern (127.0.0.1) — nicht nach außen veröffentlicht.
[program:mcp]
command=/opt/venv/bin/python -m mcp_server
directory=/app/backend
user=app
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- MCP-Reverse-Tunnel (MCP-Tools für die Agenten-PCs) --------------------
; Öffnet pro SSH-Agent aus agents.yaml einen Reverse-Forward, damit Claude-Code
; auf dem Agenten-PC den MCP-Server unter http://127.0.0.1:<mcp_port>/mcp sieht.
; Per ENV abschaltbar: MCP_TUNNEL_ENABLED=false -> kein Restart-Loop.
[program:mcp-tunnel]
command=/bin/sh -c 'if [ "${MCP_TUNNEL_ENABLED:-false}" = "true" ]; then exec /opt/venv/bin/python -m app.mcp_tunnel; else echo "mcp-tunnel disabled"; sleep infinity; fi'
directory=/app/backend
user=app
; HOME setzen — sonst sucht asyncssh Defaults in /root/.ssh (PermissionError).
environment=HOME="/home/app",USER="app"
autorestart=true
priority=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- Telegram-Bot (zweiter Eingangskanal) ---------------------------------
; Per ENV abschaltbar: TELEGRAM_ENABLED=false -> exit 0, kein Restart-Loop.
[program:telegram]
command=/bin/sh -c 'if [ "${TELEGRAM_ENABLED:-false}" = "true" ]; then exec /opt/venv/bin/python -m telegram_bot; else echo "telegram disabled"; sleep infinity; fi'
directory=/app/backend
user=app
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
