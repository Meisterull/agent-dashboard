; Prozessaufsicht für den Single-Container.
; Statt Prozesse im entrypoint mit '&' in den Hintergrund zu werfen
; (Crash bleibt unbemerkt), beaufsichtigt supervisord jeden Dienst,
; startet ihn bei Absturz neu und leitet Logs sauber nach stdout.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

; --- supervisorctl-Schnittstelle (N16) ------------------------------------
; Ohne diese drei Sections gibt es keinen RPC-Socket: `supervisorctl restart mcp`
; (in CLAUDE.md und config/agents.yaml dokumentiert) scheiterte bisher mit
; "unix:///var/run/supervisor.sock refused connection".
; Der Pfad ist bewusst /var/run/supervisor.sock — genau der, den das mitgelieferte
; /etc/supervisor/supervisord.conf als serverurl nennt. Deshalb genügt im Container
; ein blankes `supervisorctl restart mcp`, ohne -c-Angabe.
; chown=app:app, damit die als 'app' laufenden Prozesse (und ein Terminal-Login als
; 'app') den Socket benutzen können; root kommt über CAP_DAC_OVERRIDE trotzdem ran.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0770
chown=app:app

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; --- Not-Bremse: FATAL beendet den ganzen Container (M21) -----------------
; Ohne das bleibt der Container "gesund tot": stirbt z. B. api endgültig
; (BACKOFF -> FATAL), läuft nginx munter weiter, der Healthcheck geht auf
; "unhealthy" — aber Docker startet einen unhealthy Container NICHT neu.
; Ergebnis: dauerhaft 502 bis zum Handeingriff.
; Der Listener schickt supervisord (= sein Elternprozess, PID 1) ein SIGTERM;
; damit endet der Container und `restart: unless-stopped` in docker-compose.yml
; zieht ihn sauber wieder hoch.
; Der Listener läuft absichtlich OHNE user= (also als root), damit er dem
; root-supervisord signalisieren darf.
; Preis dieser Bremse: Ein Dienst, der dauerhaft nicht startet (kaputte .env,
; Syntaxfehler), erzeugt jetzt eine sichtbare Container-Restart-Schleife statt
; eines stillen Teilausfalls. Das ist Absicht — `docker ps` zeigt es sofort.
; FATAL heißt "nach startretries Versuchen nicht hochgekommen"; normale
; Abstürze eines laufenden Dienstes fängt weiterhin autorestart=true ab.
; stdout ist bei einem eventlistener der Protokollkanal — deshalb nach /dev/null
; loggen und die Klartextmeldung über stderr schicken.
[eventlistener:fatal_exit]
command=/opt/venv/bin/python -c "import sys,os,signal;sys.stdout.write('READY\n');sys.stdout.flush();h=dict(p.split(':',1) for p in sys.stdin.readline().split());sys.stdin.read(int(h.get('len','0')));sys.stderr.write('[fatal_exit] '+h.get('eventname','?')+' -> supervisord wird beendet, Container startet neu\n');sys.stderr.flush();sys.stdout.write('RESULT 2\nOK');sys.stdout.flush();os.kill(os.getppid(),signal.SIGTERM)"
events=PROCESS_STATE_FATAL
autorestart=false
startsecs=0
priority=1
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- Reverse Proxy / SSL-Terminierung -------------------------------------
; nginx-Master als root (bindet 80/443), Worker droppen selbst auf www-data.
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- FastAPI Backend (REST + WebSocket) -----------------------------------
[program:api]
command=/opt/venv/bin/uvicorn main:app --host 127.0.0.1 --port %(ENV_API_PORT)s --log-level info
directory=/app/backend
user=app
; user= wechselt nur die UID, nicht HOME — ohne das sucht asyncssh
; (SSH-Terminal-Bridge) Default-Keys/Zertifikate in /root/.ssh und stirbt
; an PermissionError.
environment=HOME="/home/app",USER="app"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- MCP-Server (Tools für den Orchestrator) ------------------------------
; Streamable-HTTP, nur intern (127.0.0.1) — nicht nach außen veröffentlicht.
[program:mcp]
command=/opt/venv/bin/python -m mcp_server
directory=/app/backend
user=app
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- MCP-Reverse-Tunnel (MCP-Tools für die Agenten-PCs) --------------------
; Öffnet pro SSH-Agent aus agents.yaml einen Reverse-Forward, damit Claude-Code
; auf dem Agenten-PC den MCP-Server unter http://127.0.0.1:<mcp_port>/mcp sieht.
; Per ENV abschaltbar: MCP_TUNNEL_ENABLED=false -> kein Restart-Loop.
[program:mcp-tunnel]
command=/bin/sh -c 'if [ "${MCP_TUNNEL_ENABLED:-false}" = "true" ]; then exec /opt/venv/bin/python -m app.mcp_tunnel; else echo "mcp-tunnel disabled"; sleep infinity; fi'
directory=/app/backend
user=app
; HOME setzen — sonst sucht asyncssh Defaults in /root/.ssh (PermissionError).
environment=HOME="/home/app",USER="app"
autorestart=true
priority=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- Telegram-Bot: ENTFERNT (M19) -----------------------------------------
; Hier stand ein [program:telegram], das `python -m telegram_bot` startete.
; Dieses Modul gibt es im Repo nicht (und gab es nie) — mit TELEGRAM_ENABLED=true
; endete das in einem stillen supervisord-FATAL. Seit M21 würde derselbe FATAL
; sogar den ganzen Container beenden. Das Feature ist damit ersatzlos raus;
; TELEGRAM_* ist auch aus .env.example verschwunden.
