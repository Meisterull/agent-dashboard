services:
  agent-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-dashboard:latest
    container_name: agent-dashboard
    restart: unless-stopped

    ports:
      # Extern belegte Ports per .env übersteuerbar (z. B. wenn 8080 schon
      # von einem anderen Dienst belegt ist).
      - "${EXTERNAL_HTTPS_PORT:-8443}:443"
      - "${EXTERNAL_HTTP_PORT:-8080}:80"
      # 5000 (FastAPI) und 9000 (MCP) sind bewusst NICHT veröffentlicht —
      # nur intern hinter nginx erreichbar.

    volumes:
      # Laufzeit-Daten (DB, Mailboxes, Projekte, Logs): beschreibbar.
      - ./workspace:/workspace
      # Statische Vorlagen-Config (vom User per Hand gepflegt): read-only.
      - ./config:/app/config:ro
      # Vom Dashboard editierbare Settings landen in /workspace/config (s.u.),
      # NICHT im read-only /app/config.
      #
      # TLS: bewusst einzelne Dateien statt ./ssl:/app/ssl:ro — sonst landet
      # auch ssl/ca.key (der Schlüssel der lokalen CA, mit dem man beliebige
      # Zertifikate fürs LAN ausstellen kann) im Container. Gebraucht werden
      # dort nur diese drei.
      # HINWEIS: Die Dateien müssen vor dem ersten `up` existieren
      # (scripts/make_cert.sh) — sonst legt Docker gleichnamige LEERE
      # VERZEICHNISSE an. Der Container startet dann trotzdem (der entrypoint
      # baut sich einen self-signed Platzhalter in /workspace/ssl);
      # make_cert.sh räumt die Verzeichnisse beim nächsten Lauf weg.
      - ./ssl/fullchain.pem:/app/ssl/fullchain.pem:ro
      - ./ssl/privkey.pem:/app/ssl/privkey.pem:ro
      - ./ssl/ca.crt:/app/ssl/ca.crt:ro
      # SSH-Keys als Secrets, read-only.
      - ./secrets:/run/secrets:ro
      # HINWEIS: /var/run/docker.sock wird bewusst NICHT gemountet.
      # Ein gemounteter Docker-Socket = effektiv Root auf dem Host und
      # wird vom Konzept nirgends gebraucht.

    # Linux: macht den Host (und damit Ollama auf :11435) als
    # host.docker.internal aus dem Container erreichbar.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env
    environment:
      - APP_ENV=production
      # Zeitpläne (Paket St.2) und Log-Zeitstempel rechnen in LOKALER Zeit —
      # ohne TZ liefe der 7-Uhr-Review auf UTC um 9 (klassische Falle).
      - TZ=${TZ:-Europe/Berlin}
      # Muss zum Host-Mapping "8443:443" oben passen (HTTP->HTTPS-Redirect).
      # muss zum Port-Mapping oben passen (nginx baut daraus den Redirect)
      - EXTERNAL_HTTPS_PORT=${EXTERNAL_HTTPS_PORT:-8443}
      - WORKSPACE_DIR=/workspace
      - CONFIG_DIR=/app/config
      - DATA_CONFIG_DIR=/workspace/config
      - SSL_DIR=/app/ssl
      - SECRETS_DIR=/run/secrets
      - MCP_HOST=127.0.0.1
      - MCP_PORT=9000
      - API_PORT=5000
      # Wie lange eine Terminal-Session ohne verbundenen Client weiterläuft
      # (Sekunden); 0 = unbegrenzt. Achtung: Sessions leben im API-Prozess —
      # ein Container-Restart beendet sie unabhängig davon.
      - SSH_GRACE_SECONDS=${SSH_GRACE_SECONDS:-86400}

    # Defense in depth — nichts davon kostet etwas im MVP.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      # nginx-Master läuft als root, muss aber die von www-data (640) und
      # root angelegten Log-/Pid-Dateien beschreiben. Ohne DAC_OVERRIDE
      # verhält sich root wie ein normaler User und scheitert daran.
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"

    # M20: Ohne das wächst /var/lib/docker/containers/<id>/*-json.log unbegrenzt
    # — der Server hatte schon einmal Root-Disk-Druck. nginx-Access-Logs gehen
    # laut nginx-Template nach stdout und landen genau hier, also hart deckeln:
    # 5 × 20 MB = maximal 100 MB pro Container.
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost:443/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - agent-dashboard-net

networks:
  agent-dashboard-net:
    driver: bridge
